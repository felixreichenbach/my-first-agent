<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>my-first-agent</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6b7280; --card:#f3f4f6; --user:#dbeafe; --accent:#2563eb; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --fg:#e6e8eb; --muted:#9aa1ab; --card:#1a1d24; --user:#1e3a5f; --accent:#60a5fa; --err:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif;
         display:flex; flex-direction:column; height:100vh; }
  header { padding:12px 16px; border-bottom:1px solid var(--card); font-weight:600; }
  header span { color:var(--muted); font-weight:400; margin-left:8px; font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:16px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:0 0 14px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; word-wrap:break-word; }
  .user { background:var(--user); margin-left:20%; }
  .assistant { background:var(--card); margin-right:10%; }
  .error { color:var(--err); }
  .steps { margin:0 0 14px; font-size:13px; color:var(--muted); }
  details { background:var(--card); border-radius:8px; padding:6px 10px; margin:4px 0; }
  summary { cursor:pointer; }
  pre { margin:6px 0 2px; white-space:pre-wrap; word-wrap:break-word; font:12px/1.4 ui-monospace, monospace; }
  .iter { margin:10px 0 2px; font-weight:600; }
  .meta { font-size:12px; color:var(--muted); margin-top:6px; }
  form { display:flex; gap:8px; padding:12px 16px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:10px 12px; border-radius:8px; border:1px solid var(--muted); background:var(--bg); color:var(--fg); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>my-first-agent <span>each step of the agent loop is shown as it happens</span></header>
<div id="log"></div>
<form id="form">
  <input id="input" autocomplete="off" placeholder="Ask something, e.g. What is 17 * 23?" autofocus>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const history = [];  // plain-text turns; sent with every request
// One id per page load groups all turns of this chat into one conversation in Agent Observability.
const conversationId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9_-]/g, "");

// All content is inserted with textContent, never innerHTML (model/tool output is untrusted).
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  log.appendChild(e);
  log.scrollTop = log.scrollHeight;
  return e;
}

function step(parent, title, body) {
  const d = document.createElement("details");
  const s = document.createElement("summary");
  s.textContent = title;
  const p = document.createElement("pre");
  p.textContent = body;
  d.append(s, p);
  parent.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function handle(ev, steps, state) {
  switch (ev.type) {
    case "iteration": state.iter = el("div", "iter", `iteration ${ev.n}`); steps.appendChild(state.iter); break;
    case "model_text": step(steps, "model says", ev.text); break;
    case "tool_call": step(steps, `tool call: ${ev.name}`, JSON.stringify(ev.input, null, 2)); break;
    case "tool_result": step(steps, `tool result: ${ev.name}${ev.is_error ? " (error)" : ""}`, ev.output); break;
    case "answer": {
      const m = el("div", "msg assistant", ev.text);
      el("div", "meta", `${ev.iterations} iteration(s) · ${ev.input_tokens} in / ${ev.output_tokens} out tokens` +
         (ev.finished ? "" : " · stopped at iteration cap"));
      history.push({ role: "assistant", content: ev.text });
      state.answered = true; break;
    }
    case "error": el("div", "msg error", `Error: ${ev.message}`); break;
  }
}

async function ask(text) {
  history.push({ role: "user", content: text });
  el("div", "msg user", text);
  const steps = el("div", "steps");
  const state = {};
  const resp = await fetch("api/chat", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ messages: history, conversation_id: conversationId }),
  });
  if (!resp.ok || !resp.body) {
    const body = await resp.json().catch(() => ({}));
    el("div", "msg error", `Error: ${body.error || resp.statusText}`);
    history.pop();
    return;
  }
  // EventSource only supports GET, so read the SSE stream by hand.
  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const raw = buf.slice(0, i); buf = buf.slice(i + 2);
      const data = raw.split("\n").find(l => l.startsWith("data: "));
      if (data) handle(JSON.parse(data.slice(6)), steps, state);
    }
  }
  if (!state.answered) history.pop();  // failed turn: don't keep the dangling question
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = ""; send.disabled = true; input.disabled = true;
  try { await ask(text); }
  catch (err) { el("div", "msg error", `Error: ${err.message}`); history.pop(); }
  finally { send.disabled = false; input.disabled = false; input.focus(); }
});
</script>
</body>
</html>
