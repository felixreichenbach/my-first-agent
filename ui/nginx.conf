server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # Proxy to the agent service on the Compose network. This container has no secrets.
    location /api/ {
        proxy_pass http://agent:8080/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # stream SSE events as they happen
        proxy_read_timeout 300s;
        client_max_body_size 200k;
    }
}
